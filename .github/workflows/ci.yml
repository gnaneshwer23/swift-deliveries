name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deliverx_phase1_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PSI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/deliverx_phase1_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Prepare isolated reliability schema
        run: >-
          psql "$PSI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1
          -f scripts/psi-phase-one-test-schema.sql
          -f drizzle/migrations/0019_psi_pilot_requests.sql
          -f drizzle/migrations/0020_psi_supervised_missions.sql
          -f drizzle/migrations/0021_psi_pilot_activations.sql
          -f drizzle/migrations/0022_psi_comparison_reservations.sql
          -f drizzle/migrations/0023_psi_comparison_reconciliation.sql
          -f drizzle/migrations/0024_wf_durable_missions.sql
          -f drizzle/migrations/0025_wf_durable_missions_fixes.sql
          -f drizzle/migrations/0026_wf_task_run_instructions.sql
          -f drizzle/migrations/0027_wf_mission_evidence.sql
          -f drizzle/migrations/0028_wf_product_memory.sql
          -f drizzle/migrations/0029_wf_memory_conflicts.sql
          -f drizzle/migrations/0030_wf_conversations.sql
      - run: npm test
      - run: npm run build
